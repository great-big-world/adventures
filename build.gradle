loom {
    accessWidenerPath = file("src/main/resources/adventures.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    common(project(path: ':core', configuration: 'namedElements')) { transitive false }
    common(project(path: ':flora-and-fauna', configuration: 'namedElements')) { transitive false }
    modCompileOnly "maven.modrinth:sodium:mc1.21.11-0.8.0-fabric"
}
